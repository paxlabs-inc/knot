# Docker Compose for HPM development environment
version: '3.8'

services:
  # HPM development environment
  hpm-dev:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: hpm-dev
    volumes:
      - .:/workspace/hpm:ro
      - hpm-projects:/workspace/projects
    working_dir: /workspace/projects
    environment:
      - HPM_REPO_URL=https://github.com/paxlabs-inc/knot.git
    command: info
    profiles:
      - dev

  # HPM build environment
  hpm-build:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: hpm-build
    volumes:
      - .:/usr/src/hpm
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/usr/src/hpm/target
    working_dir: /usr/src/hpm
    command: cargo build --release
    profiles:
      - build

  # Test runner
  hpm-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: hpm-test
    volumes:
      - .:/usr/src/hpm
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/usr/src/hpm/target
    working_dir: /usr/src/hpm
    command: cargo test
    profiles:
      - test

  # Documentation server
  docs:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: hpm-docs
    ports:
      - "8000:8000"
    volumes:
      - .:/usr/src/hpm
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/usr/src/hpm/target
    working_dir: /usr/src/hpm
    command: bash -c "cargo doc --no-deps && python3 -m http.server 8000 -d target/doc"
    profiles:
      - docs

volumes:
  hpm-projects:
    driver: local
  cargo-cache:
    driver: local
  target-cache:
    driver: local